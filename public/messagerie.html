<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LS CUSTOM — Messagerie</title><link rel="stylesheet" href="/ls-custom-theme.css?v=20261006-1"><link rel="stylesheet" href="/ui/core/base.css?v=20261006-1"><link rel="stylesheet" href="/ui/messagerie/messagerie.css?v=20261006-1"></head><body><div class="ls-shell"><main><div class="wrap page-messagerie"><header class="page-toolbar"><div><div class="dash-eyebrow">COMMUNICATION · PRIVÉ</div><h1>Messagerie</h1><p>Vos messages privés restent synchronisés avec le site et Discord.</p></div></header><div class="mail"><aside class="side"><div class="sidehead"><b>Conversations</b><button class="new" type="button" id="newMessage">+ Nouveau</button></div><div id="convos" class="convos"><div class="empty" data-empty-state>Chargement…</div></div></aside><section class="thread"><div id="threadhead" class="threadhead"><b>Sélectionnez une conversation</b><span>Vos messages privés restent synchronisés avec le site et Discord.</span></div><div id="messages" class="messages"><div class="empty" data-empty-state>Aucune conversation sélectionnée.</div></div><form id="reply" class="composer" hidden><div class="composerrow"><input id="replySubject" placeholder="Objet" maxlength="180"><textarea id="replyBody" placeholder="Écrire une réponse…"></textarea><button class="send" type="submit">Envoyer</button></div></form></section></div></div></main></div><div id="modal" class="modal" hidden><div class="modalbox"><h2>Nouveau message</h2><div class="field"><label for="recipient">Destinataire</label><select id="recipient"></select></div><div class="field"><label for="subject">Objet</label><input id="subject" maxlength="180" placeholder="Objet du message"></div><div class="field"><label for="body">Message</label><textarea id="body" maxlength="4000" placeholder="Votre message…"></textarea></div><div class="actions"><button class="cancel" type="button" id="cancelCompose">Annuler</button><button class="send" type="button" id="sendNew">Envoyer le message</button></div></div></div><div id="toast" class="toast" hidden></div><script src="/ui/messagerie/messagerie.js?v=20261006-1" defer></script><script src="/ls-custom-app.js?v=20261006-2" defer></script></body></html>
