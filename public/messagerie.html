<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LS CUSTOM — Messagerie</title>
<link rel="stylesheet" href="/ls-custom-theme.css?v=20261004-3">
<style>
:root{--bg:#08090c;--panel:#101218;--panel2:#151821;--line:#262a35;--text:#f4f5f7;--muted:#9299a8;--accent:#f5a623;--accent2:#ffbd55}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#21170a 0,transparent 35%),var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{height:100%;max-width:1400px;margin:auto;padding:22px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#f5a623,#8b5300);display:grid;place-items:center;font-weight:900}.eyebrow{font-size:10px;font-weight:850;letter-spacing:.16em;color:var(--accent)}h1{margin:2px 0;font-size:27px}.sub{color:var(--muted)}.back{color:#fff;text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:11px}.mail{min-height:0;flex:1;display:grid;grid-template-columns:320px minmax(0,1fr);background:#0e1016;border:1px solid var(--line);border-radius:20px;overflow:hidden}.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.sidehead{padding:17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.sidehead b{font-size:16px}.new{border:0;border-radius:10px;background:var(--accent);color:#16110a;font-weight:850;padding:8px 11px}.convos{overflow:auto;padding:9px}.conv{padding:13px;border-radius:13px;margin-bottom:5px;cursor:pointer;border:1px solid transparent}.conv:hover,.conv.active{background:#181b24;border-color:var(--line)}.conv.unread{border-color:#8a5d1955}.convname{font-weight:800;display:flex;justify-content:space-between;gap:8px}.convsub{color:var(--muted);font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{background:var(--accent);color:#17110a;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:900}.thread{min-width:0;display:flex;flex-direction:column}.threadhead{padding:17px 20px;border-bottom:1px solid var(--line)}.threadhead b{font-size:17px}.threadhead span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.messages{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:75%;padding:13px 15px;border-radius:15px;background:#1a1d26;border:1px solid var(--line);align-self:flex-start}.bubble.me{align-self:flex-end;background:#3a2911;border-color:#8a5d1955}.bubble small{display:block;color:#8f96a4;font-size:10px;margin-bottom:6px}.bubble strong{display:block;margin-bottom:6px}.bubble p{margin:0;white-space:pre-wrap;line-height:1.6;color:#d9dce2}.composer{border-top:1px solid var(--line);padding:15px;display:grid;gap:9px}.composerrow{display:grid;grid-template-columns:220px 1fr auto;gap:8px}.composer input,.composer textarea,.modal input,.modal textarea,.modal select{border:1px solid var(--line);background:#0a0c11;color:#fff;border-radius:11px;padding:11px;outline:none}.composer textarea{min-height:65px;resize:vertical}.send{border:0;background:var(--accent);color:#17110a;border-radius:11px;padding:10px 16px;font-weight:850}.empty{margin:auto;text-align:center;color:var(--muted);padding:40px}.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px;z-index:10}.modal[hidden]{display:none}.modalbox{width:min(560px,100%);background:#11141b;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 30px 100px #000b}.modalbox h2{margin:0}.field{display:grid;gap:6px;margin-top:13px}.field label{font-size:12px;color:#adb3bf;font-weight:700}.modal textarea{min-height:160px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.cancel{background:#252a34;color:#fff;border:0;border-radius:11px;padding:10px 14px}.toast{position:fixed;right:20px;bottom:20px;background:#151821;border:1px solid var(--line);padding:13px 16px;border-radius:13px;z-index:20}.toast.err{border-color:#ed424555}@media(max-width:800px){body{height:auto;min-height:100vh}.wrap{padding:12px}.mail{grid-template-columns:1fr;min-height:750px}.side{border-right:0;border-bottom:1px solid var(--line);max-height:290px}.composerrow{grid-template-columns:1fr}.bubble{max-width:90%}}
</style>
</head>
<body>
<div class="ls-shell"><aside></aside><main><div class="wrap">
<span id="identity" hidden></span><a id="back" href="/dashboard" hidden></a>
<div class="mail">
<aside class="side"><div class="sidehead"><b>Conversations</b><button class="new" onclick="openCompose()">+ Nouveau</button></div><div id="convos" class="convos"><div class="empty">Chargement…</div></div></aside>
<section class="thread"><div id="threadhead" class="threadhead"><b>Sélectionnez une conversation</b><span>Vos messages privés restent synchronisés avec le site et Discord.</span></div><div id="messages" class="messages"><div class="empty">Aucune conversation sélectionnée.</div></div><form id="reply" class="composer" hidden><div class="composerrow"><input id="replySubject" placeholder="Objet" maxlength="180"><textarea id="replyBody" placeholder="Écrire une réponse…"></textarea><button class="send">Envoyer</button></div></form></section>
</div></main></div>
<div id="modal" class="modal" hidden><div class="modalbox"><h2>Nouveau message</h2><div class="field"><label>Destinataire</label><select id="recipient"></select></div><div class="field"><label>Objet</label><input id="subject" maxlength="180" placeholder="Objet du message"></div><div class="field"><label>Message</label><textarea id="body" maxlength="4000" placeholder="Votre message…"></textarea></div><div class="actions"><button class="cancel" type="button" onclick="closeCompose()">Annuler</button><button class="send" type="button" onclick="sendNew()">Envoyer le message</button></div></div></div>
<div id="toast" class="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),api=async(u,o)=>{const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur');return d};
let mode='employee',contacts={employees:[],clients:[]},selected=null,identity=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const key=(t,id)=>encodeURIComponent(t+':'+id);
function toast(m,e=false){const x=$('#toast');x.textContent=m;x.hidden=false;x.className='toast '+(e?'err':'');setTimeout(()=>x.hidden=true,3200)}
function fmt(v){return new Date(v).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}
async function init(){
 try{const s=await api('/api/session/access');mode='employee';identity={type:'employee',id:String(s.user.id),name:s.user.display_name||s.user.global_name||s.user.username};$('#identity').textContent=identity.name+' · espace employé';$('#back').href='/dashboard';contacts=await api('/api/employee/mail/contacts');}
 catch(e){const c=await api('/api/client/partnership');mode='client';identity={type:'client',id:String(c.partnership.id),name:c.partnership.company};$('#identity').textContent=identity.name+' · espace partenaire';$('#back').href='/partenariats';contacts=await api('/api/client/mail/contacts')}
 fillRecipients();loadConversations();
}
function fillRecipients(){let html='';if(mode==='employee'){html+='<optgroup label="Employés">'+contacts.employees.filter(x=>x.id!==identity.id).map(x=>'<option value="employee|'+esc(x.id)+'">👤 '+esc(x.name)+'</option>').join('')+'</optgroup><optgroup label="Clients">'+contacts.clients.map(x=>'<option value="client|'+esc(x.id)+'">🤝 '+esc(x.name)+'</option>').join('')+'</optgroup>'}else html+='<optgroup label="Équipe LS CUSTOM">'+contacts.employees.map(x=>'<option value="employee|'+esc(x.id)+'">👤 '+esc(x.name)+'</option>').join('')+'</optgroup>';$('#recipient').innerHTML=html||'<option>Aucun destinataire</option>'}
async function loadConversations(){const d=await api(mode==='employee'?'/api/employee/mail':'/api/client/mail');const box=$('#convos');if(!d.rows.length){box.innerHTML='<div class="empty">Aucun message.<br><br>Commencez une nouvelle conversation.</div>';return}box.innerHTML=d.rows.map(x=>'<div class="conv '+(x.unread_count?'unread':'')+' '+(selected===x.conversation_key?'active':'')+'" onclick="openThread(\''+encodeURIComponent(x.conversation_key)+'\')"><div class="convname"><span>'+esc(x.other.name)+'</span>'+(x.unread_count?'<span class="count">'+x.unread_count+'</span>':'')+'</div><div class="convsub">'+esc(x.subject)+' · '+esc(x.preview)+'</div><div class="convsub">'+fmt(x.created_at)+'</div></div>').join('')}
window.openThread=async encoded=>{const k=decodeURIComponent(encoded);selected=k;const d=await api((mode==='employee'?'/api/employee/mail/':'/api/client/mail/')+encodeURIComponent(k));const rows=d.rows;const last=rows[rows.length-1];const other=last.sender_type===identity.type&&String(last.sender_id)===identity.id?{type:last.recipient_type,id:last.recipient_id,name:last.recipient_name}:{type:last.sender_type,id:last.sender_id,name:last.sender_name};$('#threadhead').innerHTML='<b>'+esc(other.name)+'</b><span>'+esc(last.subject)+' · conversation privée synchronisée avec Discord</span>';$('#messages').innerHTML=rows.map(m=>'<div class="bubble '+(String(m.sender_id)===identity.id&&m.sender_type===identity.type?'me':'')+'"><small>'+esc(m.sender_name)+' · '+fmt(m.created_at)+'</small><strong>'+esc(m.subject)+'</strong><p>'+esc(m.body)+'</p></div>').join('');$('#replySubject').value=last.subject||'';$('#reply').hidden=false;$('#reply').dataset.type=other.type;$('#reply').dataset.id=other.id;$('#messages').scrollTop=$('#messages').scrollHeight;loadConversations()};
function openCompose(){if($('#recipient').options.length)$('#recipient').selectedIndex=0;$('#subject').value='';$('#body').value='';$('#modal').hidden=false}
function closeCompose(){$('#modal').hidden=true}
window.closeCompose=closeCompose;window.openCompose=openCompose;
async function sendNew(){const v=$('#recipient').value||'';const [type,id]=v.split('|');if(!type||!id)return toast('Aucun destinataire disponible.',true);try{await send(type,id,$('#subject').value,$('#body').value);closeCompose();toast('Message envoyé.');loadConversations()}catch(e){toast(e.message,true)}}
async function send(type,id,subject,body){if(!String(subject).trim()||!String(body).trim())throw Error('Objet et message obligatoires.');return api(mode==='employee'?'/api/employee/mail':'/api/client/mail',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({recipient_type:type,recipient_id:id,subject,body})})}
$('#reply').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget;try{await send(f.dataset.type,f.dataset.id,$('#replySubject').value,$('#replyBody').value);$('#replyBody').value='';toast('Réponse envoyée.');openThread(encodeURIComponent(selected))}catch(err){toast(err.message,true)}});
init().catch(e=>{console.error(e);location.href='/connexion'});
</script>
<script src="/ls-custom-app.js?v=20261004-1"></script>
</body></html>
