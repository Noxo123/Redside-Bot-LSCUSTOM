<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>LS CUSTOM — Agenda</title><link rel="stylesheet" href="/portal.css"><link rel="stylesheet" href="/agenda.css"></head>
<body>
<div class="agenda-shell">
<header class="agenda-top"><a href="/" class="back">← LS CUSTOM</a><div><p class="eyebrow">ESPACE EMPLOYÉ</p><h1>Agenda</h1></div><button id="logout" class="ghost hidden">Déconnexion</button></header>
<main id="app">
<section id="login" class="login-card">
<div class="lock">🔐</div><p class="eyebrow">CONNEXION SÉCURISÉE</p><h2>Entre ton code Discord</h2><p>Sur Discord, utilise la commande <code>/connexion</code>. Si tu possèdes le rôle LS CUSTOM, le bot t’envoie un code privé valable 5 minutes.</p>
<form id="loginForm"><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required><button class="primary" type="submit">Accéder à mon agenda</button></form><div id="loginError" class="error"></div>
</section>
<section id="agenda" class="hidden">
<div class="agenda-actions"><div><p class="eyebrow">PLANNING LS CUSTOM</p><h2 id="weekTitle"></h2><p id="connected"></p></div><div class="week-nav"><button id="prev">←</button><button id="today">Aujourd'hui</button><button id="next">→</button></div></div>
<div class="agenda-grid" id="calendar"></div>
<section class="my-section"><div class="section-head"><div><p class="eyebrow">MON ESPACE</p><h2>Mes absences</h2></div><button id="add" class="primary">＋ Déclarer une absence</button></div><div id="myAbsences" class="absence-list"></div></section>
</section>
</main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><button id="close" class="modal-close">×</button><p class="eyebrow">INDISPONIBILITÉ</p><h2>Déclarer une absence</h2><form id="absenceForm">
<label>Du<input type="date" name="start_date" required></label><label>Au<input type="date" name="end_date" required></label>
<label>Type<select name="type"><option value="conges">🏖️ Congés</option><option value="maladie">🤒 Maladie</option><option value="etudes">📚 Études</option><option value="personnel">🏠 Personnel</option><option value="indisponible">🚗 Indisponible</option><option value="autre">⚠️ Autre</option></select></label>
<label>Motif / précision<textarea name="reason" maxlength="500" placeholder="Facultatif"></textarea></label><div class="modal-actions"><button type="button" id="cancel" class="ghost">Annuler</button><button class="primary">Déclarer</button></div><div id="formError" class="error"></div></form></div></div>
<script src="/agenda.js"></script>
</body></html>
