<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LS CUSTOM — Partenariat</title><link rel="stylesheet" href="/ls-custom-theme.css"><style>body{background:#070708}.client-wrap{min-height:100vh;display:grid;place-items:center;padding:28px}.client-card{width:min(1080px,100%);background:#101114;border:1px solid rgba(255,255,255,.07);border-radius:18px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.45)}.client-top{padding:30px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.25em;color:#777}.client-top h1{font-size:32px;color:#f5f5f5;margin:8px 0 0}.client-top p{color:#8b8d91;margin-top:8px}.status{border:1px solid rgba(212,160,23,.25);background:rgba(212,160,23,.08);color:#d4a017;padding:8px 12px;border-radius:10px;font-size:12px}.body{padding:24px;display:grid;gap:18px;grid-template-columns:1.1fr .9fr}.panel{background:#0c0d0f;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:20px}.panel h2{color:#f5f5f5;font-size:16px}.muted{color:#777;font-size:13px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.1);background:#17181b;color:#eee;border-radius:10px;padding:11px 14px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}.btn.gold{background:#d4a017;color:#080808;border-color:#d4a017}.login{padding:50px 24px;text-align:center}.login h1{color:#fff;font-size:28px}.login p{color:#8b8d91;margin:10px auto 24px;max-width:560px}.messages{display:flex;flex-direction:column;gap:10px;max-height:470px;overflow:auto;margin-top:15px}.msg{display:flex;gap:10px;padding:10px;border-radius:10px;background:#111214}.msg img{width:30px;height:30px;border-radius:50%}.msg .who{font-size:12px;color:#d4a017}.msg .text{font-size:13px;color:#ddd;white-space:pre-wrap;word-break:break-word;margin-top:3px}.msg time{font-size:10px;color:#555;margin-left:7px}.error{margin:24px;padding:18px;border:1px solid rgba(224,82,82,.3);background:rgba(224,82,82,.06);color:#efaaaa;border-radius:12px}@media(max-width:800px){.body{grid-template-columns:1fr}.client-top{flex-direction:column}.client-top h1{font-size:27px}}</style></head><body><main class="client-wrap"><div class="client-card"><div id="app"></div></div></main><script src="/partenariat-client.js?v=20260927-1"></script></body></html>
