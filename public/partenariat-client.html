<!doctype html>

<head>

<title>LS CUSTOM — Partenariat</title>
<link rel="stylesheet" href="/ls-custom-theme.css">
<style>
body{background:#070708!important}.client-wrap{min-height:100vh;padding:32px;display:grid;place-items:center}.client-card{width:min(1180px,100%);background:#101114;border:1px solid var(--ls-line);border-radius:12px;overflow:hidden;box-shadow:0 28px 90px rgba(0,0,0,.42)}.client-top{padding:26px 30px;border-bottom:1px solid var(--ls-line);display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{font:600 10px 'JetBrains Mono',monospace;letter-spacing:2px;color:#6f7277;text-transform:uppercase}.client-top h1{font:700 32px 'Space Grotesk',sans-serif;color:#f5f5f5;margin:8px 0 0}.client-top p{color:#85888d;margin:7px 0 0;font-size:13px}.status{border:1px solid var(--border-gold);background:var(--gold-dim);color:var(--gold);padding:8px 12px;border-radius:7px;font:700 10px 'JetBrains Mono',monospace}.body{padding:22px;display:grid;gap:14px;grid-template-columns:1fr 1fr}.panel{background:#0c0d0f;border:1px solid var(--ls-line);border-radius:9px;padding:18px}.panel h2{color:#f5f5f5;font-size:15px;margin:0}.muted{color:#73767b;font-size:12px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ls-line);background:#17181b;color:#eee;border-radius:7px;padding:9px 12px;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer}.btn.gold{background:#d4a017;color:#080808;border-color:#d4a017}.login{padding:70px 28px;text-align:center}.login h1{color:#fff;font-size:28px;margin:10px 0}.login p{color:#8b8d91;margin:10px auto 24px;max-width:560px;line-height:1.6}.conversation{grid-column:1/-1;padding:0;overflow:hidden}.conversation-head{padding:18px;border-bottom:1px solid var(--ls-line);display:flex;justify-content:space-between;gap:15px}.messages{display:flex;flex-direction:column;gap:9px;height:430px;overflow:auto;padding:18px;background:#090a0c}.msg{display:flex;gap:10px;max-width:78%;padding:10px 12px;border:1px solid var(--ls-line);background:#111214;border-radius:8px}.msg.mine{margin-left:auto;background:rgba(212,160,23,.07);border-color:rgba(212,160,23,.2)}.msg img,.avatar-fallback{width:30px;height:30px;min-width:30px;border-radius:6px;object-fit:cover;background:#292b2f;display:grid;place-items:center;color:#aaa;font-size:10px}.msg .who{font-size:11px;color:#d4a017;font-weight:700}.msg .text{font-size:12px;color:#ddd;white-space:pre-wrap;word-break:break-word;margin-top:4px;line-height:1.55}.msg time{font-size:9px;color:#555;margin-left:7px;font-weight:400}.composer{display:flex;gap:8px;padding:13px;border-top:1px solid var(--ls-line);background:#0d0e10}.composer textarea{flex:1;min-height:44px;max-height:120px;resize:vertical;padding:11px;border:1px solid var(--ls-line);background:#08090a;color:#eee;border-radius:7px;font:12px inherit}.composer button{align-self:flex-end}.send-error{padding:0 13px 10px;color:#e8a3a3;font-size:11px;background:#0d0e10}.error{margin:24px;padding:18px;border:1px solid rgba(224,82,82,.3);background:rgba(224,82,82,.06);color:#efaaaa;border-radius:9px}@media(max-width:800px){.client-wrap{padding:12px}.body{grid-template-columns:1fr}.client-top{padding:20px;flex-direction:column}.client-top h1{font-size:26px}.msg{max-width:92%}.messages{height:55vh}}
.proposal-card{grid-column:1/-1;position:relative;overflow:hidden;padding:22px;border:1px solid rgba(212,160,23,.22);background:linear-gradient(135deg,#121316,#0b0c0e);border-radius:10px}.proposal-card:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:#d4a017}.proposal-top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.proposal-badge{font:800 9px 'JetBrains Mono',monospace;letter-spacing:1.8px;color:#d4a017}.proposal-card h2{margin:7px 0 5px;font:700 21px 'Space Grotesk',sans-serif}.proposal-card p{color:#7e8186;font-size:12px;line-height:1.55;margin:0}.proposal-price{font:800 25px 'Space Grotesk',sans-serif;color:#f5c842;white-space:nowrap}.proposal-details{display:grid;grid-template-columns:220px 1fr;gap:12px;margin-top:18px}.proposal-details>div{padding:13px;border:1px solid rgba(255,255,255,.06);background:#090a0c;border-radius:8px}.proposal-details span{display:block;font:800 9px 'JetBrains Mono',monospace;color:#5e6166;letter-spacing:1px;margin-bottom:7px}.proposal-details b{font-size:12px;color:#eee}.proposal-offer p{white-space:pre-wrap;color:#c9c7c2}.proposal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn.danger{border-color:rgba(224,82,82,.3);color:#efaaaa;background:rgba(224,82,82,.06)}.proposal-note{margin-top:10px;color:#666;font-size:10px}.proposal-confirmed{display:flex;flex-direction:column;gap:5px;margin-top:15px;padding:12px;border-radius:8px;background:rgba(82,201,122,.06);border:1px solid rgba(82,201,122,.18);color:#9de0b4;font-size:12px}.proposal-confirmed span{color:#777;font-size:11px}.proposal-confirmed.declined{background:rgba(224,82,82,.05);border-color:rgba(224,82,82,.18);color:#e8a3a3}.proposal-prep{display:flex;gap:16px;align-items:center}.proposal-prep:after{content:"";width:42px;height:42px;margin-left:auto;border:2px solid rgba(212,160,23,.15);border-top-color:#d4a017;border-radius:50%;animation:proposalSpin 1s linear infinite}.client-attachments{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:9px}.client-attachment{display:block;position:relative;text-decoration:none;color:#eee;border:1px solid rgba(255,255,255,.07);background:#090a0c;border-radius:9px;overflow:hidden;padding:8px}.client-attachment.image{padding:0}.client-attachment.image img{display:block;width:100%;height:170px;object-fit:cover;background:linear-gradient(110deg,#0d0e10 25%,#17191d 40%,#0d0e10 55%);background-size:200% 100%;animation:clientShimmer 1.35s linear infinite}.client-attachment.image small,.client-attachment.file small{display:block;padding:7px 8px;color:#8b8d91;font-size:10px}.client-attachment.file{min-height:55px}.client-attachment.file b{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:7px;background:rgba(212,160,23,.12);color:#f5c842;font:800 9px 'JetBrains Mono',monospace;margin-right:8px}.client-attachment.file span{font-size:11px}.client-attachment-loader{position:absolute;z-index:2;left:50%;top:65px;width:34px;height:34px;margin:-17px;border:2px solid rgba(212,160,23,.16);border-top-color:#d4a017;border-radius:50%;animation:proposalSpin .8s linear infinite}.client-attachment-loader span{position:absolute;inset:8px;border-radius:50%;background:rgba(212,160,23,.12)}@keyframes proposalSpin{to{transform:rotate(360deg)}}@keyframes clientShimmer{to{background-position:-200% 0}}@media(max-width:800px){.proposal-top{flex-direction:column}.proposal-price{font-size:22px}.proposal-details{grid-template-columns:1fr}.proposal-card{grid-column:auto}.proposal-prep{align-items:flex-start}}</style>
