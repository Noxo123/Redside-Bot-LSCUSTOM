<style>.client-nav{max-width:1180px;margin:18px auto 0;display:flex;gap:8px;flex-wrap:wrap}.client-nav a{color:#fff;text-decoration:none;background:#11141b;border:1px solid #292d38;border-radius:10px;padding:9px 12px}.client-nav a:hover{border-color:#f5a623;color:#f5a623}</style>
