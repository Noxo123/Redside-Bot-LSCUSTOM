<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LS CUSTOM — Podium de la semaine</title>
<link rel="stylesheet" href="/ls-custom-theme.css">
<style>
body{overflow-x:hidden}.podium-shell{width:min(980px,100%);margin:auto;padding:30px 18px 40px}.podium-head{text-align:center;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:.28em;color:var(--gold);text-transform:uppercase}.podium-head h1{margin:7px 0 4px;font-size:38px}.period{color:var(--text-mid);font-size:13px}.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;align-items:end;gap:12px;max-width:820px;margin:30px auto 20px}.place{position:relative;text-align:center;border:1px solid var(--border);background:linear-gradient(180deg,rgba(212,160,23,.08),rgba(255,255,255,.02));border-radius:12px;padding:22px 12px 18px;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}.place:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0,rgba(212,160,23,.12),transparent 55%);pointer-events:none}.place.first{min-height:245px;border-color:var(--border-gold);box-shadow:0 0 35px rgba(212,160,23,.08)}.rank{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-family:'Bebas Neue';font-size:26px;color:var(--gold)}.medal{font-size:34px;margin-bottom:8px}.name{font-weight:800;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.role{font-size:11px;color:var(--text-dim);margin-top:2px}.score{margin-top:10px;font-family:'JetBrains Mono';font-size:20px;color:var(--gold)}.score small{font-family:Rajdhani;font-size:11px;color:var(--text-mid);margin-left:3px}.stats{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:8px}.stats span{font-size:10px;color:var(--text-mid);border:1px solid var(--border);border-radius:20px;padding:3px 7px}.empty{padding:40px;text-align:center;border:1px solid var(--border);border-radius:10px;color:var(--text-mid);background:var(--card)}.brand{margin-top:18px;text-align:center;color:var(--text-dim);font-size:10px;letter-spacing:.18em;text-transform:uppercase}.compact .podium-shell{padding:18px 12px}.compact .podium-head h1{font-size:28px}.compact .podium{margin-top:18px}.compact .brand{display:none}@media(max-width:650px){.podium{grid-template-columns:1fr;align-items:stretch}.place,.place.first{min-height:155px}.place.first{order:-1}.podium-shell{padding:22px 12px}}
</style>
</head>
<body>
<div class="podium-shell">
  <header class="podium-head"><div class="eyebrow">LS CUSTOM · REDSIDE RP</div><h1>🏆 PODIUM DE LA SEMAINE</h1><div id="period" class="period">Chargement…</div></header>
  <section id="podium" class="podium"></section>
  <div class="brand">Classement hebdomadaire · activité totale</div>
</div>
<script>
const q=new URLSearchParams(location.search);
if(q.get('embed')==='1')document.body.classList.add('compact');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('fr-FR');
function week(){const d=new Date();const day=d.getDay()||7;d.setHours(12,0,0,0);d.setDate(d.getDate()-day+1);const s=d.toISOString().slice(0,10);d.setDate(d.getDate()+6);return[s,d.toISOString().slice(0,10)]}
function label(v){return new Date(v+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})}
async function load(){try{const [ws,we]=week();const params=new URLSearchParams({guild_id:q.get('guild_id')||'',start:q.get('start')||ws,end:q.get('end')||we});if(!params.get('guild_id'))params.delete('guild_id');const r=await fetch('/api/public/podium?'+params);const d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');document.querySelector('#period').textContent='Semaine du '+label(d.start)+' au '+label(d.end);const medals=['🥇','🥈','🥉'];document.querySelector('#podium').innerHTML=d.rows.length?d.rows.map((x,i)=>'<article class="place '+(i===0?'first':'')+'"><div class="rank">#'+(i+1)+'</div><div class="medal">'+medals[i]+'</div><div class="name">'+esc(x.display_name)+'</div><div class="role">'+esc(x.role_name)+'</div><div class="score">'+fmt(x.actions)+' <small>actions</small></div><div class="stats"><span>Appels '+fmt(x.appels)+'</span><span>Réparations '+fmt(x.reparations)+'</span><span>Fourrières '+fmt(x.fourrieres)+'</span><span>Perso '+fmt(x.personnalisations)+'</span><span>Factures '+fmt(x.factures)+'</span></div></article>').join(''):'<div class="empty">Aucune activité enregistrée pour cette semaine.</div>'}catch(e){document.querySelector('#podium').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
load();
</script>
</body>
</html>
