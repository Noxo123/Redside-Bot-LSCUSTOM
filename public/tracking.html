<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LS CUSTOM — Partenariats</title><link rel="stylesheet" href="/ls-custom-theme.css"><style id="partnershipPremiumStyles">
.partner-msg{display:flex;gap:11px;align-items:flex-start}.partner-msg-body{min-width:0}.partner-attachments{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:9px}.partner-attachment{display:flex;gap:10px;align-items:center;text-decoration:none;color:#eee;border:1px solid rgba(255,255,255,.07);background:#0a0b0d;border-radius:9px;padding:7px;overflow:hidden}.partner-attachment.image{display:block;position:relative;padding:0}.partner-attachment.image img{display:block;width:100%;height:150px;object-fit:cover;background:linear-gradient(110deg,#0d0e10 25%,#17191d 40%,#0d0e10 55%);background-size:200% 100%;animation:lsShimmer 1.4s linear infinite}.partner-attachment.image span{display:block;padding:7px 9px;font-size:10px;color:#9e9890}.partner-attachment.file{min-height:58px}.partner-file-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:7px;background:rgba(212,160,23,.12);color:#f5c842;font:800 9px 'JetBrains Mono',monospace}.partner-attachment.file small{display:block;color:#777;margin-top:3px}.partner-attach-tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.partner-attach-tools span{font-size:10px;color:#65686d}.ls-modal-backdrop{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.76);backdrop-filter:blur(9px);animation:lsFade .18s ease}.ls-modal{position:relative;width:min(620px,100%);background:#101114;border:1px solid rgba(212,160,23,.25);border-radius:14px;box-shadow:0 35px 100px rgba(0,0,0,.6);padding:26px;animation:lsModal .22s ease}.ls-modal h2{margin:7px 0;color:#f5f5f5;font:700 25px 'Space Grotesk',sans-serif}.ls-modal-sub{margin:0 0 22px;color:#777;line-height:1.5;font-size:12px}.ls-modal-close{position:absolute;right:14px;top:12px;border:0;background:transparent;color:#777;font-size:25px;cursor:pointer}.ls-modal label{display:block;color:#a7a29a;font-size:11px;font-weight:700;margin:0 0 13px}.ls-modal label span{color:#d4a017}.ls-modal input,.ls-modal textarea{width:100%;box-sizing:border-box;margin-top:7px;padding:11px 12px;border:1px solid rgba(255,255,255,.08);background:#08090a;color:#eee;border-radius:8px;outline:none;font:12px inherit}.ls-modal input:focus,.ls-modal textarea:focus{border-color:rgba(212,160,23,.55)}.ls-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ls-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.proposal-btn{border-color:rgba(212,160,23,.3)!important}.partner-error{color:#efaaaa;font-size:11px;margin-top:8px}@keyframes lsShimmer{to{background-position:-200% 0}}@keyframes lsFade{from{opacity:0}to{opacity:1}}@keyframes lsModal{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}@media(max-width:700px){.ls-modal-grid{grid-template-columns:1fr}.ls-modal{padding:20px}.partner-attachments{grid-template-columns:1fr}}
</style></head><body><div class="min-h-screen lg:grid lg:grid-cols-[270px_1fr]"><aside></aside><main class="min-w-0"><div id="content"></div></main></div><script src="/tracking.js?v=20260928-1"></script><script src="/ls-custom-app.js?v=20260927-2"></script></body></html>
