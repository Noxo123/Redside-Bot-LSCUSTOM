name: Syntax check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check src/db.js
      - run: node --check src/dashboard.js
      - run: node --check src/bot.js
      - run: node --check src/index.js
      - run: node --check public/pilotage.js
